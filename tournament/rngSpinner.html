<!DOCTYPE html>

		<style>
			body {
				font-family: "Doodlian";
				text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 1px 1px #000, -1px -1px #000, 1px -1px #000, -1px 1px #000;
			}
			
			main {
				display: flex;
				text-align: center;
			}
			
			.game-area, .condition-area {
				flex: 0px 1 0;
			}
			
			.segment-header {
				font-size: 3em;
				margin: 14px 0px;
			}
			
			.segment-subheader {
				font-size: 2em;
				margin: 10px 0px;
			}
			
			.segment-info {
				padding: 30px;
				font-family: sans-serif;
				font-size: 1.2em;
				text-align: left;
			}
			
			#rules-list {
				padding-left: 40px;
			}
			
			.tourney-logo {
				width: 20vw;
			}

			.roller-lights {
				position: absolute;
				top: 16px;
				left: -40px;
				display: flex;
				flex-flow: row;
				justify-content: center;
				gap: 610px;
			}

			.roller-lights img {
				width: 40px;
			}

			#lights-middle {
				top: 86px;
			}

			#lights-bottom {
				top: 156px;
			}
			
			.slots-area {
				display: flex;
				justify-content: center;
				flex-flow: row;
				width: fit-content;
				border: solid black 6px;
				border-radius: 25px;
				margin: 10px auto;
				overflow: clip;
			}
			
			.slot-roll {
				width: 600px;
				overflow: clip;
				background: linear-gradient(to right, #E5E1D7, #FFFFFF, #E5E1D7);
				text-align: center;
			}
			
			#slot-roller {
				height: 200px;
			}
			
			#slot-roller-condition {
				height: 80px;
			}
			
			.slot-image-container {
				display: flex;
				height: 200px;
			}
			
			.slot-image {
				display: block;
				max-width: 580px;
				max-height: 180px;
				margin: auto;
				filter: drop-shadow(0px 0px 5px black);
			}
			
			.slot-text-container {
				display: flex;
				height: 80px;
			}
			
			.slot-text {
				display: block;
				width: 580px;
				padding-top: 6px;
				margin: auto;
				filter: drop-shadow(0px 0px 5px black);
				font-size: 30px;
			}
			
			.roll-button {
				font-weight: bold;
				cursor: pointer;
				font-family: "Doodlian";
				color: white;
				text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 1px 1px #000, -1px -1px #000, 1px -1px #000, -1px 1px #000;
				padding: 8px 10px 6px;
				background: #3A5E33;
				border: solid black 4px;
				transition: all 0.08s;
			}
			
			.roll-button:hover {
				background: #4A7741;
			}
			
			.roll-button-null {
				background: #2D352B;
				pointer-events: none;
			}
			
			#main-button {
				font-size: 2.5em;
			}
			
			#reroll-button {
				font-size: 1.2em;
				border: solid black 2px;
			}
			
			.sloticon-spinin {
				animation: sloticon-spinin 0.3s ease-out 0s 1 normal;
			}
			
			@keyframes sloticon-spinin {
				0% {
					transform: translate(0,0);
				}
				
				95% {
					transform: translate(0,7px);
				}
				
				100% {
					transform: translate(0,0);
				}
			}
			
			.sloticon-spinout {
				animation: sloticon-spinout 0.5s ease-out 0s 1 normal;
			}
			
			@keyframes sloticon-spinout {
				0% {
					transform: translate(0,0);
				}
				
				10% {
					transform: translate(0,-7px);
				}
				
				100% {
					transform: translate(0,0);
				}
			}
			
			.text-rainbow {
				animation: text-rainbow 1s linear 0s infinite normal;
				filter: grayscale(40%);
			}
			
			@keyframes text-rainbow {
				0% {
					color: rgba(255, 0, 0, 1);
				}
				
				10% {
					color: rgba(255, 154, 0, 1);
				}
				
				20% {
					color: rgba(208, 222, 33, 1);
				}
				
				30% {
					color: rgba(79, 220, 74, 1);
				}
				
				40% {
					color: rgba(63, 218, 216, 1);
				}
				
				50% {
					color: rgba(47, 201, 226, 1);
				}
				
				60% {
					color: rgba(28, 127, 238, 1);
				}
				
				70% {
					color: rgba(95, 21, 242, 1);
				}
				
				80% {
					color: rgba(186, 12, 248, 1);
				}
				
				90% {
					color: rgba(251, 7, 217, 1);
				}
				
				100% {
					color: rgba(255, 0, 0, 1);
				}
			}
		</style>
