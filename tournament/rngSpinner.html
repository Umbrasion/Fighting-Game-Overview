<!DOCTYPE html>
<html>
	<head>
		<title>RNG Spinner</title>
		<meta charset="utf-8">
		<link rel="icon" href="../favicon.ico">
		<link rel="stylesheet" href="../styles/main.css">
		<link rel="stylesheet" href="tourneyStyles.css">
		<script src="../scripts/jquery-3.7.1.min.js"></script>
		<script src="spinner.js" defer></script>
		<script src="conditions.js" defer></script>
		<script src="ogo.js" defer></script>
	</head>
	<body>
		<header>
			<h1>READY OR NOT, GAMBLE!</h1>
		</header>
		<main>
			<div class="game-area">
				<h1 class="segment-header">RULES</h1>
				<h2 id="game-name" class="segment-subheader"></h2>
				<ul id="rules-list" class="segment-info">
					<li></li>
				</ul>
			</div>
			<div class="main-area">
				<div class="logo-area">
					<!-- <img class="tourney-logo" src="../img/logos/RNG_logo.png"> -->
					<img class="tourney-overlay" src="Tourney_Window_2.png">
					<img class="tourney-overlay-hands" src="Tourney_Window_Hands.png">
				</div>
				<div class="spin-area">
					<div id="lights-top" class="roller-lights"><img src="Light_off.png"><img src="Light_off.png"></div>
					<div id="lights-middle" class="roller-lights"><img src="Light_off.png"><img src="Light_off.png"></div>
					<div id="lights-bottom" class="roller-lights"><img src="Light_off.png"><img src="Light_off.png"></div>
					<div class="slots-area">
						<div id="slot-roller" class="slot-roll">
							<div id="slot-container">
								<div class="slot-image-container">
									<img class="slot-image" src="../img/logos/RNG_logo.png">
								</div>
								<div class="slot-image-container">
									<img class="slot-image" src="../img/logos/AFQM_logo.png">
								</div>
							</div>
						</div>
					</div>
					<div class="slots-area">
						<div id="slot-roller-condition" class="slot-roll">
							<div id="slot-container-condition">
								<div class="slot-text-container">
									<span class="slot-text">CONDITION</span>
								</div>
								<div class="slot-text-container">
									<span class="slot-text"></span>
								</div>
							</div>
						</div>
					</div>
					<div>
						<button id="main-button" class="roll-button" onclick="initiateRoll()"><span id="main-button-text" class="">LET THE HANDS OF FATE DECIDE!</span></button><br><br>
						<button id="reroll-button" class="roll-button" onclick="initiateReroll()">Reroll Pick</button>
					</div>
				</div>
			</div>
			<div class="condition-area">
				<div>
					<h1 class="segment-header">CONDITION</h1>
					<h2 id="condition-name" class="segment-subheader"></h2>
					<p id="condition-description" class="segment-info"></p>
					<div id="condition-refimg" class="segment-info"></div>
				</div>
				<div id="condition-addfunction">
				</div>
			</div>
		</main>
		<div id="imgview-bg" onclick="commonImgBlowUp()">
			<div id="imgview-container"></div>
		</div>
		<div id="ogo-bg">
			<div id="ogo-area">
				<h2 class="ogo-title">OFF-GAME OUTBREAK</h2>
				<div class="options-container">
					<div class="logo-container">
						<a class="logo-link" onclick="setToGame('MnS')">
							<img class="logo-ogo" src="SP_logos/MnS_logo.png" data-description="A PvP bullet hell where you have to dodge and weave around the opponent's bullets while firing off your own.">
						</a>
					</div>
					<div class="logo-container">
						<a class="logo-link" onclick="setToGame('UMAPD')">
							<img class="logo-ogo" src="SP_logos/UMAPD_logo.png" data-description="A party game where you use a team of 5 characters to compete against other players in a set of various minigames.">
						</a>
					</div>
					<div class="logo-container">
						<a class="logo-link" onclick="setToGame('REX')">
							<img class="logo-ogo" src="SP_logos/REX_logo.png" data-description="A platform fighter with a massive roster of characters and stages, built on the Project+ Brawl mod.">
						</a>
					</div>
					<div class="logo-container">
						<a class="logo-link" onclick="setToGame('CMC+')">
							<img class="logo-ogo" src="SP_logos/CMC+_logo.png" data-description="A modpack for the platform fighter Super Smash Bros. Crusade, with a staggering amount of characters, assists, and stages.">
						</a>
					</div>
					<div class="logo-container">
						<a class="logo-link" onclick="setToGame('SCB')">
							<img class="logo-ogo" src="SP_logos/SCB_logo.png" data-description="A PvP platformer where you take control of various characters from retro games and fight against other players using the tools the characters offer you.">
						</a>
					</div>
				</div>
				<div id="popupbox-description"></div>
			</div>
		</div>
		<div id="debug-area" style="transform: translate(calc(-600px - 2vh), 0px)">
			<div class="debug-segment"></div>
			<div class="debug-segment" style="flex-flow: column"></div>
		</div>
	</body>
</html>
