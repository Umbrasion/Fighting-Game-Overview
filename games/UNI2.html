		<title>Under Night In-Birth II Sys:Celes | Fighting Game Overview</title>

	<body>
		<img class="game-logo" src="img/logos/UNI2_logo.png">
		<div id="character-lighting"></div>
		<div id="flavor-text"></div>
		<div class="background-text">
			<div>UNDER NIGHT IN-BIRTH II Sys:Celes</div>
			<div>CHARACTER SELECT</div>
			<div>Choose a character that responds to the direction of your soul.<br>Of course, you may decide according to the mood of the day.<br>However, please be careful as there is a time limit.</div>
		</div>
		<div id="characterselect">
			<div class="preview-area">
				<div class="portrait-area">
					<div style="display: flex; flex-direction: column; width: 0px; height: 0px; margin: auto; justify-content: left; align-items: center">
						<div style="width: fit-content">
							<img id="info-portrait" src="" style="max-width: none">
						</div>
					</div>
					<h2 id="info-name" class="info-title"></h2>
				</div>
				<div class="css-container">
					<img id="select-cursor" src="img/characterSelect/uni2/Cursor.png" style="opacity: 0">
					<a id="character-eltnum" onclick="runDisplay('Eltnum')" data-flavortext="She slaughters. The path she has carved herself and those who follow in it. The potential hidden within the have-nots, she has come to witness for herself. The threads of fate play a trick and the actress must once more perform. The perfect distraction from certain boredom. Until the curtains rise on her stage once more.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Eltnum_icon.webp" data-scale="1,-3,-12" data-lightcolor="228,122,250">
						</div>
					</a>
					<a id="character-kuon" onclick="runDisplay('Kuon')" data-flavortext="He pursues. And he continues to pursue. He pursues a spirit of a distant past. An existence he calls his own. Eternal protector. Avenger. Destroyer of the world. He has existed in many forms. Will he find the answer he seeks? Is there a peaceful existence for him?">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Kuon_icon.webp" data-scale="1.5,-2.5,-23" data-lightcolor="250,2,94">
						</div>
					</a>
					<a id="character-phonon" onclick="runDisplay('Phonon')" data-flavortext="She wishes. She yearns for powers beyond the ordinary. Trailing along beside her is a white follower. She waits for the time to awaken from her false self, and awaken she does. The sword speaks to her on a path leading to a bright future, but she turns in another direction, only to find the sword blocking her way. A way that trails from a murky past over which she has trampled.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Phonon_icon.webp" data-scale="0.92,-13,-11" data-lightcolor="251,76,130">
						</div>
					</a>
					<a id="character-nanase" onclick="runDisplay('Nanase')" data-flavortext="She dances. Taking on the pure air from the night sky, she seeks the one who turned her into an In-birth. The young boy with a long red blade. Her pure and silky white skin, that is contrasted with her body that has been consumed by the night. The traces of her innocence are clouded. Is what she is feeling truly the desire for vengeance? Perhaps the answers will present itself in the story... maybe.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Nanase_icon.webp" data-scale="1.08,8,-10" data-lightcolor="79,240,198">
						</div>
					</a>
					<a id="character-seth" onclick="runDisplay('Seth')" data-flavortext="He wanders. Bound by the will and governing of an ancient family, but his emotions tremor. The promise he made with a young girl shackles him in rusty chains he strives to sever. The Night becomes a labyrinth, impeding his progress. Will he ever find the beacon he seeks?">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Seth_icon.webp" data-scale="0.88,10,-6" data-lightcolor="8,153,250">
						</div>
					</a>
					<a id="character-waldstein" onclick="runDisplay('Waldstein')" data-flavortext="He rages. In order to protect his master, the beast will raze buildings and crush trees with his own two hands. To stand by his master's side, he takes on the curse of eternity, transcending the power of mankind. On this quiet night he thinks about his master, and how he may die on the battlefield one day...">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Waldstein_icon.webp" data-scale="1.18,7,-20" data-lightcolor="74,180,157">
						</div>
					</a>
					<a id="character-hyde" onclick="runDisplay('Hyde')" data-flavortext='He awakens. In order to free the girl from the chains of eternity that seal her fate. The power burning within him is the "Void". The blade he carries, the Insulator. Each day became lost in a sea of banality, living under the threat of the Night. The Hollow Night approaches and where reality and fantasy meet, this young boy takes a stand... to reclaim everything and return it to nothingness.'>
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Hyde_icon.webp" data-scale="1.15,-26,-4" data-lightcolor="218,0,90">
						</div>
					</a>
					<a id="character-linne" onclick="runDisplay('Linne')" data-flavortext="She repeats. To unearth the truth behind her eternity and settle a score with her brother. The sword she sought and the encounter with its wielder... Therein lies the path that will change her fate. The rusty cogs begin to turn once more, their ripples beckoning her to the end of her tale.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Linne_icon.webp" data-scale="0.7,0,-14" data-lightcolor="255,143,19">
						</div>
					</a>
					<a id="character-carmine" onclick="runDisplay('Carmine')" data-flavortext="He hungers. His body drenched in blood thirsts for more, but nothing can satiate his desire for violence. He must show that none are more powerful than he. His fangs and claws pierce his enemies in their entirety. Still, he cannot let his blood go dry and he hunts for more prey to satisfy his lust.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Carmine_icon.webp" data-scale="0.9,-29,-1" data-lightcolor="246,19,27">
						</div>
					</a>
					<a id="character-yuzuriha" onclick="runDisplay('Yuzuriha')" data-flavortext="She reacts. She runs away from her laws and chooses to be alone, living life as she pleases, bound to no one. Tonight, too, is nothing more for her than a whimsical stroll. The naked sword is seldom drawn, but when it is, the blade never lies. Everything is reflected in its clear glimmer... And her true self lies beyond the freedom she attained. The self she has lost.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Yuzuriha_icon.webp" data-scale="1.12,13,-25.3" data-lightcolor="249,2,154">
						</div>
					</a>
					<a id="character-byakuya" onclick="runDisplay('Byakuya')" data-flavortext="They nest. The web will lure and consume any prey that goes near. They fight - he, for her, and her for herself. Her feelings point in one direction, to a friend defeated. She sips on blood and mud alike, chasing a shadow. His eight legs will crawl through the night once more, carrying with him her feelings.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Byakuya_icon.webp" data-scale="1,-8,-12" data-lightcolor="189,145,254">
						</div>
					</a>
					<a id="character-mika" onclick="runDisplay('Mika')" data-flavortext="She arrives. She escapes, unfettered, from her tedious routine. She flies through the sky, swims across the ocean, and climbs over mountains. Her travels are undertaken in earnest, so as to never lose her beloved friend again. Her desires are expressed in fists, which she swings with all of her might as far as she can reach.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Mika_icon.webp" data-scale="1.38,-0.5,-28" data-lightcolor="242,222,2">
						</div>
					</a>
					<a id="character-kaguya" onclick="runDisplay('Kaguya')" data-flavortext="She watches. She watches her target as her bullet penetrates it. Her killing instinct is the very reaper that disperses life to the winds. Her mind is etched with disturbing memories of childhood. The time for farewells shall eventually come.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Kaguya_icon.webp" data-scale="0.94,-23,-17" data-lightcolor="116,167,239">
						</div>
					</a>
					<a id="character-akatsuki" onclick="runDisplay('Akatsuki')" data-flavortext="He hides. To carry out the mission assigned to him and for the love of country. He was considered dead, yet resurfaces over half a century later. Surrounded by devices unfamiliar, he fights to protect himself. How he wandered into this night is a mystery. Hopefully, you may forgive the lack of details... since he is only a guest.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Akatsuki_icon.webp" data-scale="0.95,-21,-1" data-lightcolor="0,255,255">
						</div>
					</a>
					<!---->
					<a id="character-izumi" onclick="runDisplay('Izumi')" data-flavortext="She acts. She acts at last - the time has finally come. Her destination: The edge of the deep night. The dutiful one shall bravely swim. The answers lie within the silence. The surface of the water peacefully shifts into a mirror that reflects prayer. There lies the final fragment.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Izumi_icon.webp" data-scale="1.1,-8,-21" data-lightcolor="140,226,243">
						</div>
					</a>
					<a id="character-uzuki" onclick="runDisplay('Uzuki')" data-flavortext="She was running out of patience. I'm bored. Can't you find anything interesting? More violence. More blood. Flesh. Bones. Everything is lovely. The world is created by life. The merchant who sprinkles death around tells us. The time left to me is not long.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Uzuki_icon.webp" data-scale="1.3,-1.8,-15" data-lightcolor="245,1,83">
						</div>
					</a>
					<a id="character-tsurugi" onclick="runDisplay('Tsurugi')" data-flavortext="He rises. He rises as the stalwart knight defending his comrades. He doesn't want anyone to get hurt. He wants to be their protector. This desire gives him strength. His ironclad conviction is an insurmountable wall through which nothing can pass.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Tsurugi_icon.webp" data-scale="1.05,-12.5,-9" data-lightcolor="253,151,55">
						</div>
					</a>
					<a id="character-hilda" onclick="runDisplay('Hilda')" data-flavortext="She savors. She wields her power for a single purpose. Light and Dark, the contradiction that exists inside of her. A helix of contradiction and chaos with no order. Darkness that covers the eyes. A voice that comes from deep within the earth. The false eyes chase after eternity and she wishes for Re-birth.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Hilda_icon.webp" data-scale="1.03,-20,-5" data-lightcolor="167,125,255">
						</div>
					</a>
					<a id="character-merkava" onclick="runDisplay('Merkava')" data-flavortext="He fears. Every day the curse that permeates through his body grows stronger. The memory lost, the flesh that is no longer, the hunger that cannot be fulfilled. He dashes across the earth drenched in red, trailing behind him his crimson arms. A beast of the Void. Neither peace nor hope has resided in this body for a long, long time.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Merkava_icon.webp" data-scale="1.24,-2,-17" data-lightcolor="161,88,246">
						</div>
					</a>
					<a id="character-orie" onclick="runDisplay('Orie')" data-flavortext="She judges. And hopes that the heavy weight placed on her frail shoulders may one day be lifted. Delicate physique and delicate sword -- its point aimed at the monster responsible for her parents death. Light fills her body, and the melody she sings resonates throughout the city. The girl, a beacon of justice... no doubt her shadow will burn in the eyelids of her enemies.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Orie_icon.webp" data-scale="1.15,-1,-13" data-lightcolor="130,171,234">
						</div>
					</a>
					<a id="character-wagner" onclick="runDisplay('Wagner')" data-flavortext="She annihilates. She is exalted and engulfed in the scorching flames of her family name, taking an oath of eternal loyalty to Adelheid. She shows neither forgiveness nor love, but the reflection of her sword. No divine grace can save her soul from the battlefield. She treads on the ashes of the dead as she awaits her judgment.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Wagner_icon.webp" data-scale="0.9,-34,0.5" data-lightcolor="242,190,1">
						</div>
					</a>
					<a id="character-enkidu" onclick="runDisplay('Enkidu')" data-flavortext="He suffers. Both what he seeks and the path he takes are born of desperation. His body shows no change as he searches for worthy adversaries, treading the path to creatures of far greater power. His well-trained fists smite darkness and in his name resounds calamity. All for the sake of fulfilling his promise to a long-lost friend.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Enkidu_icon.webp" data-scale="0.88,-15,-6" data-lightcolor="167,0,247">
						</div>
					</a>
					<a id="character-gordeau" onclick="runDisplay('Gordeau')" data-flavortext="He reaps. He slashes his enemies to satisfy, but it is not enough - he wishes to reunite with an old friend and offer a souvenir. The land is vast, expanding as far as the eye can see. The sky, without boundaries, no ceiling. He raises his sickle and prepares for the Night.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Gordeau_icon.webp" data-scale="1.4,-10,-14" data-lightcolor="110,79,255">
						</div>
					</a>
					<a id="character-vatista" onclick="runDisplay('Vatista')" data-flavortext="She serves. A pawn that sleeps eternally. A puppet with no will to call her own. Her master, nowhere to be seen. There is but one directive that resonates within her to this day - the end of peace is the beginning of war. To destroy the Voids once and for all.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Vatista_icon.webp" data-scale="1.25,21.2,-17.5" data-lightcolor="236,19,88">
						</div>
					</a>
					<a id="character-chaos" onclick="runDisplay('Chaos')" data-flavortext="He schemes. Staring down his opponents from behind his glasses. He keeps a beast within and a book filled with nothing but chaos. He awaits the chance to unleash his power. The desire to find his beloved friend and a comrade who tries to stop him. But which he was going to pick was obvious... The beast shows its fangs, crushing anything it finds in its path.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Chaos_icon.webp" data-scale="0.93,-5,0" data-lightcolor="0,250,194">
						</div>
					</a>
					<a id="character-londrekia" onclick="runDisplay('Londrekia')" data-flavortext="He seeks. A beautiful equation that corrects the past and leads to the future. Wishing for happiness and for putting an end to the tragedies. He loves. The dawn of glittering diamond dust and the plains of silvery white. The wizard who freezes all things hopes for a warm spring.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Londrekia_icon.webp" data-scale="1.05,-3,-8" data-lightcolor="136,223,255">
						</div>
					</a>
					<a id="character-ogre" onclick="runDisplay('Ogre')" data-flavortext="He wakes. He wakes from a long sleep, his body languid. His consciousness hazy. Where am I? Who am I? Endless questions. No answers. Only forward movement. Someone from behind pushes him ever forward.">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Ogre_icon.webp" data-scale="0.94,3,-7" data-lightcolor="221,0,146">
						</div>
					</a>
					<a id="character-random" onclick="runDisplay('Random')">
						<div class="css css-character">
							<img src="img/characterSelect/uni2/Random_icon.webp">
						</div>
					</a>
				</div>
				<div class="p2-area"></div>
			</div>
