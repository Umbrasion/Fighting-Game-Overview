<!DOCTYPE html>
<html>
	<head>
		<title>Ultimate Marvel vs. Capcom 3 | Fighting Game Overview</title>
		<link rel="stylesheet" href="../styles/main.css">
		<link rel="stylesheet" href="../styles/infoColors.css">
		<link rel="stylesheet" href="../styles/games/UMvC3.css">
		<script src="../scripts/common.js"></script>
		<script src="../scripts/cssResize.js" defer></script>
		<script src="../scripts/onloadUMvC3.js" defer></script>
		<script src="../scripts/jquery-3.7.1.min.js"></script>
	</head>
	<body>
		<img class="game-logo" src="img/logos/UMvC3_logo.png">
		<div id="characterselect">
			<div class="preview-area">
				<div class="portrait-area">
					<div style="display: flex; flex-direction: column; width: 0px; height: 0px; margin: auto; justify-content: left; align-items: center">
						<div style="width: fit-content">
							<img id="info-portrait" src="">
						</div>
					</div>
					<h2 id="info-name" class="info-title" style="height: 1.2em"></h2>
				</div>
				<div class="css-container">
					<a class="css-character" onclick="runDisplay('')">
						<img src="img/characterSelect/umvc3/_icon.png">
					</a>
				</div>
				<div class="p2-area"></div>
			</div>
		</div>
		<div class="description-bg">
			<div class="description-area"></div>
		</div>
		<div class="preload-container">
			<audio muted=true src="audio/music/UMvC3 - Character Select intro.ogg"></audio>
			<audio muted=true src="audio/music/UMvC3 - Character Select loop.ogg"></audio>
		</div>
	</body>
</html>
